[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "final-isis"
version = "0.1.0"
description = "Raw CSA scan to model-derived NASA-CDF-like ionogram"
requires-python = ">=3.12,<3.13"
dependencies = [
    "cdflib==1.3.12",
    "matplotlib==3.11.1",
    "numpy==2.5.2",
    "pillow==12.3.0",
    "scipy==1.18.0",
    "torch==2.13.0",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.16.4"]
notebooks = [
    "ipykernel==7.3.0",
    "jupyterlab==4.6.3",
    "nbconvert==7.17.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
