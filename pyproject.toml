[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "final-isis"
version = "0.1.0"
description = "Convert scanned CSA ISIS-2 ionograms into calibrated model data"
requires-python = ">=3.12,<3.13"
dependencies = [
    "cdflib==1.3.12",
    "matplotlib==3.11.1",
    "numpy==2.5.2",
    "pillow==12.3.0",
    "scipy==1.18.0",
    "torch==2.13.0",
]

[project.optional-dependencies]
dev = ["coverage==7.10.6", "pytest==9.1.1", "ruff==0.16.4"]
notebooks = [
    "ipykernel==7.3.0",
    "jupyterlab==4.6.3",
    "nbconvert==7.17.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff.lint.per-file-ignores]
"scripts/**/*.py" = ["E402"]
"tests/test_catalog_builders.py" = ["E402"]
"tests/test_download_candidate_data.py" = ["E402"]
"notebooks/**/*.ipynb" = ["E402"]
